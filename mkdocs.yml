site_name: portolan-cli
site_description: A CLI tool for managing cloud-native geospatial data
site_author: Nissim Lebovits
site_url: https://portolan-sdi.github.io/portolan-cli/
repo_name: portolan-sdi/portolan-cli
repo_url: https://github.com/portolan-sdi/portolan-cli
edit_uri: edit/main/docs/

theme:
  name: material
  # Zensical builds this site. `classic` keeps the Material 9
  # markup, so every `.md-*` selector in extra.css still applies.
  variant: classic
  # The header is a solid blue band, so the mark on it is cream. The
  # favicon sits on a browser tab, so it is blue. The sync in
  # portolan-ops owns both files.
  logo: assets/images/portolan-logomark-fcfcfa.svg
  favicon: assets/images/portolan-logomark-4163cc.svg
  # Light mode only. The brand kit carries no dark theme and no toggle.
  palette:
    scheme: default
    primary: custom
    accent: custom
  # Google Fonts serves both families. Hanken Grotesk sets prose and
  # headlines. JetBrains Mono sets code, labels, data, and paths.
  font:
    text: Hanken Grotesk
    code: JetBrains Mono
  features:
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  # Order is load-bearing. `_brand-vars.css` declares the tokens on
  # `:root` and `extra.css` reads them. The sync in portolan-ops owns
  # the first file.
  - assets/stylesheets/_brand-vars.css
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/portolan-sdi/portolan-cli
      name: Portolan CLI on GitHub

plugins:
  # Zensical builds the search index natively. It still reads this
  # entry. Keep it, because MkDocs drops search when the `plugins` key
  # exists and omits it. That keeps the rollback leg complete.
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            docstring_style: google

# This list is exhaustive on purpose. Both builders replace their
# default set when this key exists. Add an extension here before you
# use its syntax in a page.
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

# Zensical validates links and anchors by default. State the level so
# MkDocs, which defaults anchors to `info`, reports the same problems.
validation:
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Examples: examples.md
  - Reference:
    - Overview: reference/index.md
    - CLI Reference: reference/cli.md
    - Python API Reference: reference/python.md
    - Configuration Reference: reference/configuration.md
  - Contributing: contributing.md
  - Changelog: changelog.md
