# prek configuration. Every hook blocks on failure.
# Install: uv run prek install
#:schema https://www.schemastore.org/prek.json

# Stop after the first hook failure.
fail_fast = true

# A bare `prek install` installs all three hook types.
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

# ---------- built-in hooks (native Rust, no network) ----------
[[repos]]
repo = "builtin"
hooks = [
  # --- Format & whitespace ---
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },

  # --- Syntax validation ---
  { id = "check-yaml" },
  { id = "check-toml" },

  # --- Safety & security ---
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
  {
    id = "check-added-large-files",
    args = ["--maxkb=500"],
    exclude = { glob = ["tests/fixtures/realdata/**", "tests/fixtures/raster/**", "tests/fixtures/vector/**"] },
  },
]

# ---------- external tool hooks ----------

# Ruff runs from uv.lock, so the hook and `uv run ruff` use one version.
[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff",
    name = "ruff",
    entry = "uv run ruff check --fix --force-exclude",
    language = "system",
    types = ["python"],
    require_serial = true,
  },
  {
    id = "ruff-format",
    name = "ruff-format",
    entry = "uv run ruff format --force-exclude",
    language = "system",
    types = ["python"],
    require_serial = true,
  },
]

[[repos]]
repo = "https://github.com/jendrikseipp/vulture"
rev = "v2.16"
hooks = [
  # No args. The hook reads paths, exclude, and min_confidence from
  # [tool.vulture], so it checks what `uv run vulture` checks.
  { id = "vulture" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.1.0"
hooks = [
  { id = "commitizen", stages = ["commit-msg"] },
]

# ---------- workflow linting: SHA pins, least privilege, no template injection ----------
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
  # -shellcheck= turns off the optional shellcheck binary, which varies by
  # machine. The gate is actionlint's own workflow validation.
  { id = "actionlint", args = ["-shellcheck="] },
]

[[repos]]
repo = "https://github.com/woodruffw/zizmor-pre-commit"
rev = "v1.26.1"
hooks = [
  # --no-online-audits makes no network calls, so the hook works offline.
  { id = "zizmor", args = ["--no-online-audits"] },
]

# Relative links and anchors, with the org rules. No network access.
# CI checks external links weekly. See portolan-ops norms/ci.md.
[[repos]]
repo = "https://github.com/portolan-sdi/portolan-ops"
rev = "v1.12.0"
hooks = [{ id = "lychee" }]

# ---------- local hooks ----------
[[repos]]
repo = "local"
hooks = [
  # Block commits of worktree files.
  {
    id = "forbid-worktrees",
    name = "forbid worktree files",
    shell = "bash",
    entry = "echo 'ERROR - Worktree files should not be committed. Remove .claude/worktrees/ from staging.' && exit 1",
    language = "system",
    files = { glob = ".claude/worktrees/**" },
    pass_filenames = false,
  },

  # Regenerate the AGENTS.md sections from code.
  {
    id = "update-agents-md",
    name = "auto-update AGENTS.md sections",
    entry = "uv run python scripts/generate_agents_md_sections.py --update",
    language = "system",
    files = { glob = ["AGENTS.md", "pyproject.toml", "portolan_cli/cli.py"] },
    pass_filenames = false,
  },

  {
    id = "validate-agents-md",
    name = "validate AGENTS.md references",
    entry = "uv run python scripts/validate_agents_md.py",
    language = "system",
    files = { glob = ["AGENTS.md"] },
    pass_filenames = false,
  },
  {
    id = "mypy",
    name = "mypy",
    entry = "uv run mypy",
    language = "system",
    types = ["python"],
    pass_filenames = false,
    require_serial = true,
  },
  {
    id = "fast-tests",
    name = "fast tests",
    entry = "uv run pytest",
    language = "system",
    types = ["python"],
    args = ["tests/", "-m", "unit", "--timeout=30", "-q", "-x"],
    pass_filenames = false,
    stages = ["pre-push"],
    require_serial = true,
  },
  {
    id = "import-linter",
    name = "architecture rules",
    entry = "uv run lint-imports",
    language = "system",
    files = { glob = ["pyproject.toml", "portolan_cli/**/*.py", "packages/portolan-core/**/*.py"] },
    pass_filenames = false,
  },
  {
    id = "deptry",
    name = "dependency checker",
    entry = "uv run deptry .",
    language = "system",
    files = { glob = ["pyproject.toml", "portolan_cli/**/*.py"] },
    pass_filenames = false,
  },
  # The root run excludes packages/. Each workspace member declares its own
  # dependencies, so deptry reads the member's pyproject.toml.
  {
    id = "deptry-core",
    name = "dependency checker (portolan-core)",
    entry = "uv run deptry packages/portolan-core --config packages/portolan-core/pyproject.toml",
    language = "system",
    files = { glob = ["packages/portolan-core/pyproject.toml", "packages/portolan-core/**/*.py"] },
    pass_filenames = false,
  },

  # CI runs `prek run --all-files`, so these hooks are the one rule source.
  # pyproject.toml [tool.codespell] holds the codespell config.
  {
    id = "codespell",
    name = "spell check",
    entry = "uv run codespell",
    language = "system",
    args = ["portolan_cli", "packages", "tests", "docs"],
    pass_filenames = false,
  },
  # The gate fails when a commit adds a clone to .jscpd-baseline.json. After a
  # real dedup, run `jscpd --update-baseline` and lower the pinned count.
  {
    id = "jscpd",
    name = "duplicate code (jscpd, baseline-gated)",
    entry = "uvx jscpd@5.2.1 portolan_cli packages tests --baseline .jscpd-baseline.json --fail-on-new-clones 0",
    language = "system",
    files = { glob = ["portolan_cli/**/*.py", "packages/**/*.py", "tests/**/*.py", ".jscpd.json", ".jscpd-baseline.json"] },
    pass_filenames = false,
  },
  # Cap docstrings and comment blocks at 2 lines and ban history in them.
  {
    id = "check-comments",
    name = "docstring and comment length and history",
    entry = "uv run python scripts/check_comments.py",
    language = "system",
    files = { glob = ["portolan_cli/**/*.py", "packages/**/*.py", "scripts/**/*.py", "tests/**/*.py", "examples/**/*.py", "vulture_whitelist.py", "pyproject.toml", "prek.toml", ".github/workflows/*.yml"] },
    pass_filenames = true,
  },
]
