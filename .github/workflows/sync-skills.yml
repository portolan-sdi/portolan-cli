name: Sync Skills Install Instructions

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:  # Manual trigger

# The PR comes from the org sync app, not GITHUB_TOKEN. GitHub starts no
# workflow for a PR that GITHUB_TOKEN opens, so the checks never ran on it.
# Auto-merge is armed, so the PR lands when the required checks pass.
permissions:
  contents: read

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Sync from upstream
        run: python scripts/sync_skills_readme.py --update

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.OPS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_SYNC_APP_KEY }}
          owner: portolan-sdi
          repositories: portolan-cli
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: sync/skills-install
          delete-branch: true
          title: "sync: Update skills install instructions"
          body: |
            Automated sync of installation instructions from [portolan-skills](https://github.com/portolan-sdi/portolan-skills).

            ---
            _Auto-generated by [sync-skills](https://github.com/portolan-sdi/portolan-cli/blob/main/.github/workflows/sync-skills.yml)_
          commit-message: "sync: Update skills install instructions from upstream"
          labels: |
            automated
            skills

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
