# Tier 3 CI - Scheduled nightly checks
#
# Philosophy: These are the "expensive" checks that would slow down PRs.
# They still fail the build - we track trends but don't accept regressions.
name: Nightly
on:
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily
  workflow_dispatch:  # Allow manual triggering
    inputs:
      record-baseline:
        # Run the perf scenarios without the regression check and upload the
        # results. A maintainer commits the artifact as
        # .benchmarks/scenarios.json, so the baseline comes from this runner
        # type and never from a dev machine.
        description: Record a scenario baseline instead of comparing with one
        type: boolean
        default: false

# Nightly jobs only read the repo. A job needing more (e.g. network-live opening
# a tracking issue) widens its own permissions block.
permissions:
  contents: read

jobs:
  rashid-main:
    # Early warning for upstream validator drift: validate a freshly generated
    # catalog against rashid's main branch (the released pin is exercised by
    # regular CI). A failure here means an unreleased rashid rule change will
    # break `portolan check` at its next release — fix generation, or raise it
    # upstream, before that release ships.
    name: Conformance vs rashid main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A baseline-recording dispatch needs only the scenarios job.
    if: ${{ !inputs.record-baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.11

      - name: Install dependencies with rashid from main
        run: |
          uv sync --all-extras
          uv pip install --reinstall \
            "rashid @ git+https://github.com/portolan-sdi/rashid@main"

      - name: Validate a generated catalog against rashid main
        run: |
          uv run pytest \
            tests/integration/test_generated_catalog_conformance.py \
            -q --no-cov

  mutation:
    name: Mutation Testing
    # The only place mutation runs. ci.yml used to mutate the files a pull
    # request changed, on a 30 minute timeout, which is too slow to sit in
    # front of every merge. This sweep covers the tree a shard at a time
    # instead, and the shard rotates nightly.
    runs-on: ubuntu-latest
    # Hash-assigned shards hold 2-12 files rather than a uniform 6, so the
    # largest night runs roughly twice the mutants of the 6-file shard that took
    # 20 minutes. 90 leaves headroom without letting a hung run burn an hour.
    timeout-minutes: 90
    # A baseline-recording dispatch skips the mutation shard, the costliest job.
    if: ${{ !inputs.record-baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Select nightly shard
        id: shard
        run: |
          # Mutating all ~45k mutants can't finish in one nightly window, so each
          # night mutates a deterministic 1/NUM_SHARDS slice of the source files,
          # keyed by day-of-year. The whole tree is covered every NUM_SHARDS
          # nights. Lower NUM_SHARDS to cover more per night — but only if a run
          # still finishes within timeout-minutes, and re-measure the per-shard
          # rates in .mutation-shards.json, which a new count invalidates.
          # Mutation runs nightly only. Pull requests carry no mutation gate,
          # so this sweep is the sole mutation signal. See #612 and #779.
          NUM_SHARDS=25
          DAY=$(( 10#$(date -u +%j) ))
          SHARD=$(( DAY % NUM_SHARDS ))
          # Membership is a hash of each file's path, not its index in the sorted
          # list: index assignment reshuffles every file's shard whenever one file
          # is added, which would invalidate all recorded per-shard rates on any
          # commit that adds a module. See scripts/shard_select.py.
          if ! uv run python scripts/shard_select.py \
                 --root portolan_cli --num-shards "$NUM_SHARDS" --shard "$SHARD" \
                 > shard_files.txt; then
            echo "::error::scripts/shard_select.py failed to select this shard;" \
                 "refusing to report an unmutated sweep as passing."
            exit 1
          fi
          mapfile -t SHARD_FILES < shard_files.txt
          if [ "${#SHARD_FILES[@]}" -eq 0 ]; then
            # Backstop: shard_select.py already exits non-zero on an empty shard,
            # so this only fires if the selector is swapped for one that doesn't.
            # Either way, a night that mutates nothing is not a passing sweep (#612).
            echo "::error::Shard ${SHARD} of ${NUM_SHARDS} selected no files."
            exit 1
          fi
          echo "shard=${SHARD}" >> "$GITHUB_OUTPUT"
          echo "num_shards=${NUM_SHARDS}" >> "$GITHUB_OUTPUT"
          # mutmut filters on mutant names (portolan_cli.foo.x_bar__mutmut_1),
          # not file paths, so translate. See scripts/mutant_globs.py and #612.
          # Via a file, not process substitution: the latter discards the
          # translator's exit status, so a crash would leave GLOBS empty and the
          # next step would skip the shard as "no files" — a silent green sweep.
          if ! uv run python scripts/mutant_globs.py "${SHARD_FILES[@]}" > globs.txt; then
            echo "::error::scripts/mutant_globs.py failed to translate this" \
                 "shard's files; refusing to report an unmutated sweep as passing."
            exit 1
          fi
          mapfile -t GLOBS < globs.txt
          echo "Shard ${SHARD} of ${NUM_SHARDS}: ${#SHARD_FILES[@]} file(s)," \
               "${#GLOBS[@]} with mutants"
          if [ "${#GLOBS[@]}" -gt 0 ]; then
            printf '  %s\n' "${GLOBS[@]}"
            echo "has_globs=true" >> "$GITHUB_OUTPUT"
          else
            # Every file in this shard is mutant-free (re-export __init__.py,
            # constant tables, protocol stubs). mutant_globs.py listed them on
            # stderr above. Handing mutmut their globs is what failed run
            # 30735881276, so the run and floor steps sit this night out.
            echo "::notice::Shard ${SHARD} of ${NUM_SHARDS} holds no mutable" \
                 "code; skipping the sweep. See portolan-sdi/portolan-cli#716."
            echo "has_globs=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'globs<<GLOBS_EOF'
            printf '%s\n' "${GLOBS[@]}"
            echo 'GLOBS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run mutation testing (rotating shard)
        if: steps.shard.outputs.has_globs == 'true'
        env:
          GLOBS_RAW: ${{ steps.shard.outputs.globs }}
        run: |
          # mutmut still generates every mutant (~1 min) then tests only the
          # shard's. Surviving mutants do NOT fail mutmut — it exits 0 and the
          # floor check grades the score — so any non-zero status is a real
          # failure and fails the sweep.
          mapfile -t RAW <<< "$GLOBS_RAW"
          GLOBS=()
          for g in "${RAW[@]}"; do [ -n "$g" ] && GLOBS+=("$g"); done
          if [ "${#GLOBS[@]}" -eq 0 ]; then
            # Unreachable: the step only runs when has_globs is true. Empty here
            # means the globs output was lost between steps, and mutating nothing
            # must never report as a passing sweep (#612).
            echo "::error::has_globs was true but no globs arrived; refusing to" \
                 "report an unmutated sweep as passing."
            exit 1
          fi
          # pipefail keeps `tee` from reporting success on mutmut's behalf;
          # `|| STATUS=$?` keeps `set -e` from killing the step before the
          # diagnostics below can run.
          set -o pipefail
          STATUS=0
          uv run mutmut run "${GLOBS[@]}" 2>&1 | tee mutmut-run.log || STATUS=$?
          if grep -q "Filtered for specific mutants, but nothing matches" mutmut-run.log; then
            echo "::error::mutmut matched no mutants for this shard's globs — the" \
                 "glob format is wrong, not the code. See scripts/mutant_globs.py (#612)."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::mutmut run failed with status ${STATUS}; the sweep is" \
                 "incomplete. See 'Tests and the mutation sandbox' in docs/contributing.md (#997)."
            exit "$STATUS"
          fi

      - name: Enforce mutation floor
        if: steps.shard.outputs.has_globs == 'true'
        env:
          SHARD: ${{ steps.shard.outputs.shard }}
          NUM_SHARDS: ${{ steps.shard.outputs.num_shards }}
        run: |
          # Export aggregates and enforce two floors: the repo-wide catastrophe
          # floor in .mutation-baseline, and this shard's own recorded rate from
          # .mutation-shards.json (a shard's rate depends on which modules land
          # in it, so the repo-wide number alone either flaps or gates nothing).
          # No --allow-empty here: on the full sweep, zero testable mutants means
          # mutation testing is broken (the #612 silent-green guard), not a pass.
          uv run mutmut export-cicd-stats
          uv run python scripts/mutation_score.py \
            --stats mutants/mutmut-cicd-stats.json \
            --baseline .mutation-baseline \
            --shards .mutation-shards.json \
            --shard "$SHARD" \
            --num-shards "$NUM_SHARDS" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --label "nightly shard ${SHARD}"

      - name: Generate mutation report
        if: always() && steps.shard.outputs.has_globs == 'true'
        run: |
          # Generate text report for artifact (mutmut 3.x has no HTML export)
          # Note: JSON stats only have aggregates, not individual mutations
          uv run mutmut results --all true > mutation-results.txt
          # Also save the JSON stats
          cp mutants/mutmut-cicd-stats.json .

      - name: Upload mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: |
            mutation-results.txt
            mutmut-cicd-stats.json
          retention-days: 30
        if: always()

  scenarios:
    name: Perf Scenarios (wall time and peak RSS)
    # Runs the S1, S2, S3, S4, and S8 scenarios of tests/perf at full size and
    # compares wall time and peak RSS with .benchmarks/scenarios.json.
    # tests/perf/bench.py states the thresholds: +30% wall, +15% RSS. The
    # wall limit scales by the calibration ratio of the two runners. A
    # missing baseline fails the run. CPU regressions in pure-Python paths
    # are CodSpeed's job in ci.yml, and extra work is the counter gates' job.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run the scenarios against the committed baseline
        env:
          RECORD_BASELINE: ${{ inputs.record-baseline }}
        run: |
          # A record-baseline run writes the results without the compare. A
          # maintainer commits the artifact as .benchmarks/scenarios.json, so
          # the baseline comes from this runner type and never a dev machine.
          compare=(--compare .benchmarks/scenarios.json)
          if [ "$RECORD_BASELINE" = "true" ]; then
            compare=()
          fi
          uv run python -m tests.perf.bench --out scenario-results.json "${compare[@]}"

      - name: Upload scenario results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-results
          path: scenario-results.json
          retention-days: 90
        if: always()

  network-live:
    name: Live Network Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Non-blocking: live third-party servers (ArcGIS, WFS, ...) being flaky is not
    # something a contributor can fix, so a failure does NOT fail the workflow —
    # it opens/updates a single tracking issue instead (mirrors security-audit.yml).
    # A baseline-recording dispatch skips the job, so it cannot touch the
    # tracking issue.
    if: ${{ !inputs.record-baseline }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run network tests against live services
        id: nettests
        # Keep the workflow green; the tracking-issue step below is the signal.
        continue-on-error: true
        run: |
          # -rfE prints a short "FAILED/ERROR" summary at the tail; tee keeps a
          # copy so the run-summary + tracking-issue steps below can name the
          # tests that failed. A step with no `shell:` runs `bash -e`, without
          # pipefail, so the pipe returned tee's status and the step outcome
          # was always success. pipefail keeps pytest's exit code.
          set -o pipefail
          uv run pytest tests/ \
            -m network \
            --timeout=120 \
            -v -rfE \
            2>&1 | tee network-test-output.txt

      - name: Surface network-test failure in run summary
        # continue-on-error above keeps the job badge green even though the
        # step's real outcome was 'failure' — which has misled triage. Make the
        # failure legible in the run summary and capture the failing test names
        # for the tracking issue body. Pass/fail semantics are untouched: this
        # only runs on the failure path and only adds information.
        if: steps.nettests.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ Live network tests FAILED (non-blocking)"
            echo ""
            echo "The \`nettests\` step outcome was **failure**, but the job badge"
            echo "stays green by design (live third-party services). See the"
            echo "tracking issue for history."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -E '^(FAILED|ERROR)' network-test-output.txt \
               > network-test-failures.txt; then
            {
              echo "Failing tests:"
              echo ""
              echo '```'
              cat network-test-failures.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No individual FAILED/ERROR lines were captured (the step may" \
                 "have crashed before pytest reported)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Track live-network status as a single issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Trusted github context, via env not a ${{ }} splice into JS (zizmor).
          TESTS_OUTCOME: ${{ steps.nettests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const outcome = process.env.TESTS_OUTCOME;
            const runUrl = process.env.RUN_URL;
            const label = 'nightly-network-failure';
            const title = 'Nightly live-network tests are failing';

            // Failing-test names captured by the "Surface network-test failure"
            // step (pytest -rfE short summary). Best-effort: absent if the step
            // crashed before pytest reported.
            let failures = '';
            try {
              failures = fs.readFileSync('network-test-failures.txt', 'utf8').trim();
            } catch {}
            const failuresBlock = failures
              ? ['**Failing tests:**', '', '```', failures, '```']
              : ['_Failing test names were not captured — see the run log._'];

            // Ensure the tracking label exists (idempotent).
            try {
              await github.rest.issues.getLabel({owner, repo, name: label});
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd73a4a',
                description: 'Auto-managed: nightly live-network test failures',
              });
            }

            const {data: open} = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label,
            });
            const existing = open[0];

            if (outcome === 'failure') {
              const body = [
                'The nightly **live-network** test job failed against third-party',
                'services. This job is non-blocking (live servers can be flaky), but a',
                'persistent failure may indicate a real regression in an extractor.',
                '',
                ...failuresBlock,
                '',
                `Latest failing run: ${runUrl}`,
                '',
                '_Managed automatically — closes when the next nightly run passes._',
              ].join('\n');
              if (existing) {
                await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Still failing — ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({owner, repo, title, labels: [label], body});
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Live-network tests recovered — closing. ${runUrl}`,
              });
              await github.rest.issues.update({owner, repo, issue_number: existing.number, state: 'closed'});
            }

  slow-tests:
    name: Slow Tests (Stress/Scale)
    runs-on: ubuntu-latest
    # Most tests here are capped by --timeout=300. The two 1000-file tests in
    # tests/integration/test_versioning_stress.py share one add and carry a
    # 1800s cap (SCALE_1000_TIMEOUT_S explains the number). The job took 32m
    # to 46m in October 2026, when each of those tests ran its own add. One
    # shared add with sort and bbox off took 28% of the old time on a dev
    # machine. 50m still holds a full 30m scale test and the rest of the suite.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run slow tests (stress/scale scenarios)
        run: |
          uv run pytest tests/ \
            -m slow \
            --timeout=300 \
            --durations=15 \
            -v

  property-tests:
    name: Property Tests (unseeded)
    # CI runs each @given test with HYPOTHESIS_PROFILE=ci: 25 examples and a
    # fixed seed. This job runs the same tests with the nightly profile from
    # tests/conftest.py: 500 examples and a random seed, so each night
    # explores new inputs. A failure prints its reproduce_failure blob, and
    # the step copies it into the run summary.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run every property test with random examples
        run: |
          set -o pipefail
          # The decorator at the start of a line. A bare "@given" also
          # matches docstrings that name the decorator.
          mapfile -t FILES < <(grep -rlE '^\s*@given\(' tests --include="test_*.py" | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No @given test files found; the property run tests nothing."
            exit 1
          fi
          status=0
          uv run pytest "${FILES[@]}" \
            -m "not network and not slow and not benchmark and not e2e and not e2e_slow" \
            -n logical --hypothesis-show-statistics -rfE \
            2>&1 | tee prop.log || status=$?
          grep -B2 -A6 "reproduce_failure" prop.log >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

  gate-selftest:
    name: Gate Self-Test
    # Injects one known fault per quality gate into a copy of the tree and
    # fails when a gate stays green. See scripts/gate_selftest.py.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Prove each gate catches its fault
        run: |
          set -o pipefail
          uv run python scripts/gate_selftest.py | tee -a "$GITHUB_STEP_SUMMARY"

  iceberg-e2e-full:
    name: Iceberg E2E Tests (Full Suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra iceberg --extra dev --extra e2e

      - name: Start Docker services
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml up -d --wait

      - name: Wait for REST catalog
        run: timeout 60 bash -c 'until curl -sf http://localhost:8181/v1/config; do sleep 2; done'

      - name: Wait for RustFS
        run: timeout 60 bash -c 'until curl -sf http://localhost:9000/health/live; do sleep 2; done'

      - name: Run E2E tests (full suite, includes e2e_slow)
        run: uv run pytest tests/iceberg/e2e/ -v --tb=long -m e2e --timeout=120

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml logs

      - name: Teardown
        if: always()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml down -v
