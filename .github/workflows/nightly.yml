# Tier 3 CI - Scheduled nightly checks
#
# Philosophy: These are the "expensive" checks that would slow down PRs.
# They still fail the build - we track trends but don't accept regressions.
name: Nightly
on:
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily
  workflow_dispatch:  # Allow manual triggering
    inputs:
      record-baseline:
        # Run the perf scenarios without the regression check and upload the
        # results. A maintainer commits the artifact as
        # .benchmarks/scenarios.json, so the baseline comes from this runner
        # type and never from a dev machine.
        description: Record a scenario baseline instead of comparing with one
        type: boolean
        default: false

# Nightly jobs only read the repo. A job needing more (e.g. network-live opening
# a tracking issue) widens its own permissions block.
permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing
    # The only place mutation runs. ci.yml used to mutate the files a pull
    # request changed, on a 30 minute timeout, which is too slow to sit in
    # front of every merge. This sweep covers the tree a shard at a time
    # instead, and the shard rotates nightly.
    runs-on: ubuntu-latest
    # Hash-assigned shards hold 2-12 files rather than a uniform 6, so the
    # largest night runs roughly twice the mutants of the 6-file shard that took
    # 20 minutes. 90 leaves headroom without letting a hung run burn an hour.
    timeout-minutes: 6
    # A baseline-recording dispatch skips the mutation shard, the costliest job.
    if: ${{ !inputs.record-baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Select nightly shard
        id: shard
        run: |
          # Mutating all ~45k mutants can't finish in one nightly window, so each
          # night mutates a deterministic 1/NUM_SHARDS slice of the source files,
          # keyed by day-of-year. The whole tree is covered every NUM_SHARDS
          # nights. Lower NUM_SHARDS to cover more per night — but only if a run
          # still finishes within timeout-minutes, and re-measure the per-shard
          # rates in .mutation-shards.json, which a new count invalidates.
          # Mutation runs nightly only. Pull requests carry no mutation gate,
          # so this sweep is the sole mutation signal. See #612 and #779.
          NUM_SHARDS=25
          DAY=$(( 10#$(date -u +%j) ))
          SHARD=$(( DAY % NUM_SHARDS ))
          # Membership is a hash of each file's path, not its index in the sorted
          # list: index assignment reshuffles every file's shard whenever one file
          # is added, which would invalidate all recorded per-shard rates on any
          # commit that adds a module. See scripts/shard_select.py.
          if ! uv run python scripts/shard_select.py \
                 --root portolan_cli --num-shards "$NUM_SHARDS" --shard "$SHARD" \
                 > shard_files.txt; then
            echo "::error::scripts/shard_select.py failed to select this shard;" \
                 "refusing to report an unmutated sweep as passing."
            exit 1
          fi
          mapfile -t SHARD_FILES < shard_files.txt
          if [ "${#SHARD_FILES[@]}" -eq 0 ]; then
            # Backstop: shard_select.py already exits non-zero on an empty shard,
            # so this only fires if the selector is swapped for one that doesn't.
            # Either way, a night that mutates nothing is not a passing sweep (#612).
            echo "::error::Shard ${SHARD} of ${NUM_SHARDS} selected no files."
            exit 1
          fi
          echo "shard=${SHARD}" >> "$GITHUB_OUTPUT"
          echo "num_shards=${NUM_SHARDS}" >> "$GITHUB_OUTPUT"
          # mutmut filters on mutant names (portolan_cli.foo.x_bar__mutmut_1),
          # not file paths, so translate. See scripts/mutant_globs.py and #612.
          # Via a file, not process substitution: the latter discards the
          # translator's exit status, so a crash would leave GLOBS empty and the
          # next step would skip the shard as "no files" — a silent green sweep.
          if ! uv run python scripts/mutant_globs.py "${SHARD_FILES[@]}" > globs.txt; then
            echo "::error::scripts/mutant_globs.py failed to translate this" \
                 "shard's files; refusing to report an unmutated sweep as passing."
            exit 1
          fi
          mapfile -t GLOBS < globs.txt
          echo "Shard ${SHARD} of ${NUM_SHARDS}: ${#SHARD_FILES[@]} file(s)," \
               "${#GLOBS[@]} with mutants"
          if [ "${#GLOBS[@]}" -gt 0 ]; then
            printf '  %s\n' "${GLOBS[@]}"
            echo "has_globs=true" >> "$GITHUB_OUTPUT"
          else
            # Every file in this shard is mutant-free (re-export __init__.py,
            # constant tables, protocol stubs). mutant_globs.py listed them on
            # stderr above. Handing mutmut their globs is what failed run
            # 30735881276, so the run and floor steps sit this night out.
            echo "::notice::Shard ${SHARD} of ${NUM_SHARDS} holds no mutable" \
                 "code; skipping the sweep. See portolan-sdi/portolan-cli#716."
            echo "has_globs=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'globs<<GLOBS_EOF'
            printf '%s\n' "${GLOBS[@]}"
            echo 'GLOBS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run mutation testing (rotating shard)
        if: steps.shard.outputs.has_globs == 'true'
        env:
          GLOBS_RAW: ${{ steps.shard.outputs.globs }}
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/mutation-pytest.xml
        run: |
          # mutmut still generates every mutant (~1 min) then tests only the
          # shard's. Surviving mutants do NOT fail mutmut — it exits 0 and the
          # floor check grades the score — so any non-zero status is a real
          # failure and fails the sweep.
          mapfile -t RAW <<< "$GLOBS_RAW"
          GLOBS=()
          for g in "${RAW[@]}"; do [ -n "$g" ] && GLOBS+=("$g"); done
          if [ "${#GLOBS[@]}" -eq 0 ]; then
            # Unreachable: the step only runs when has_globs is true. Empty here
            # means the globs output was lost between steps, and mutating nothing
            # must never report as a passing sweep (#612).
            echo "::error::has_globs was true but no globs arrived; refusing to" \
                 "report an unmutated sweep as passing."
            exit 1
          fi
          # pipefail keeps `tee` from reporting success on mutmut's behalf;
          # `|| STATUS=$?` keeps `set -e` from killing the step before the
          # diagnostics below can run.
          set -o pipefail
          STATUS=0
          # Preserve the stats worker's pytest failure output for this diagnostic run.
          uv run python - <<'PYCONFIG'
          from pathlib import Path
          path = Path("pyproject.toml")
          source = path.read_text().replace("[tool.mutmut]", "[tool.mutmut]\ndebug = true")
          source = source.replace('paths_to_mutate = ["portolan_cli/"]', 'paths_to_mutate = ["portolan_cli/backends/__init__.py", "portolan_cli/backends/protocol.py"]')
          source = source.replace('also_copy = [', 'also_copy = ["portolan_cli/",')
          source = source.replace('pytest_add_cli_args_test_selection = ["tests/"]', 'pytest_add_cli_args_test_selection = ["tests/iceberg/integration/test_cli_add_iceberg.py::test_add_geojson_creates_iceberg_table"]')
          path.write_text(source)
          PYCONFIG
          GLOBS=("portolan_cli.backends.x_get_backend__mutmut_1")
          uv run mutmut run "${GLOBS[@]}" 2>&1 | tee mutmut-run.log || STATUS=$?
          if grep -q "Filtered for specific mutants, but nothing matches" mutmut-run.log; then
            echo "::error::mutmut matched no mutants for this shard's globs — the" \
                 "glob format is wrong, not the code. See scripts/mutant_globs.py (#612)."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::mutmut run failed with status ${STATUS}; the sweep is" \
                 "incomplete. See 'Tests and the mutation sandbox' in docs/contributing.md (#997)."
            exit "$STATUS"
          fi

      - name: Generate mutation report
        if: always() && steps.shard.outputs.has_globs == 'true'
        run: |
          # Generate text report for artifact (mutmut 3.x has no HTML export)
          # Note: JSON stats only have aggregates, not individual mutations
          uv run mutmut results --all true > mutation-results.txt
          # Also save the JSON stats
          uv run mutmut export-cicd-stats
          cp mutants/mutmut-cicd-stats.json .

      - name: Upload mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: |
            mutmut-run.log
            mutation-pytest.xml
            mutation-results.txt
            mutmut-cicd-stats.json
          retention-days: 30
        if: always()
