# Synced from portolan-sdi/portolan-ops (ci/dependabot-automerge.yml).
# The workflow checks the PR author and does not run PR code.
name: Dependabot auto-merge

on:
  # Dependabot pull_request runs receive a read-only token. This trusted-base
  # event keeps the requested write permissions. The workflow checks out no
  # pull request code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions:
  contents: read

jobs:
  dependabot:
    uses: portolan-sdi/portolan-ops/.github/workflows/reusable-dependabot-automerge.yml@v1
    permissions:
      contents: write
      pull-requests: write
