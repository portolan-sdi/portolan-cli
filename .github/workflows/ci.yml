# Tier 2 CI: every gate is strict. Actions are SHA-pinned, checkouts set
# persist-credentials: false, and the token is read-only unless a job widens it.
name: CI
on:
  push:
    branches: [main]
  # No `branches:` filter, so a pull request into any branch gets the full CI.
  pull_request:
  workflow_dispatch:  # Allow manual triggering

# Least-privilege default; no job here writes to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push to a PR obsoletes the old).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One uv version for every job. Renovate raises it after the 7-day delay.
env:
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.13.8"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      iceberg: ${{ steps.filter.outputs.iceberg }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            iceberg:
              - 'portolan_cli/backends/iceberg/**'
              - 'tests/iceberg/**'
              - 'pyproject.toml'
              # pyiceberg can move in the lock alone, so a lock change runs the Iceberg jobs.
              - 'uv.lock'
            python:
              - 'portolan_cli/**/*.py'
              - 'packages/portolan-core/**/*.py'

  quality:
    name: Quality Gates (prek — single rule source)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Run all quality gates
        # CI runs the same prek.toml hooks as a developer. no-commit-to-branch fails on
        # push to main, and the test job runs the full suite, so both skip here.
        env:
          SKIP: no-commit-to-branch,fast-tests
        run: uvx prek run --all-files --show-diff-on-failure

  security:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Audit dependencies (runtime + extras only)
        # Audit only what ships in the wheel. The hashed export needs no venv (ensurepip fails on
        # the 26.04 runner), and --no-emit-workspace drops the unhashed editable member lines.
        run: |
          uv export --no-dev --no-emit-workspace \
            --extra iceberg --extra pmtiles --extra thumbnails \
            -o /tmp/runtime-deps.txt
          # shellcheck disable=SC2046  # intentional word-splitting of the flag list
          uv run pip-audit \
            --disable-pip --require-hashes \
            --requirement /tmp/runtime-deps.txt \
            $(uv run python scripts/pip_audit_ignores.py)

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Anchor cells run the full suite on every event. The other cells run the unit lane on
        # pull requests and the full suite on push to main.
        include:
          - {os: ubuntu-latest, python-version: '3.11', suite: full}
          - {os: ubuntu-latest, python-version: '3.13', suite: full}
          - {os: windows-latest, python-version: '3.13', suite: full}
          - {os: macos-latest, python-version: '3.13', suite: full}
          - {os: ubuntu-latest, python-version: '3.12', suite: unit}
          - {os: windows-latest, python-version: '3.11', suite: unit}
          - {os: windows-latest, python-version: '3.12', suite: unit}
          - {os: macos-latest, python-version: '3.11', suite: unit}
          - {os: macos-latest, python-version: '3.12', suite: unit}
    env:
      # Prevent obstore from attempting EC2 metadata service calls
      # GitHub Actions runners aren't EC2 instances, so IMDS requests fail
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install ${{ matrix.python-version }}

      - name: Install tippecanoe (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tippecanoe

      - name: Install tippecanoe (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tippecanoe

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Run tests (unit + integration, no network, no iceberg)
        # `-n logical` starts 4 workers where `-n auto` started 2. Only ubuntu 3.11 measures
        # coverage. HYPOTHESIS_PROFILE=ci is the reduced profile, and tests/perf runs in perf-gates.
        env:
          HYPOTHESIS_PROFILE: ci
          MATRIX_SUITE: ${{ matrix.suite }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python-version }}
        shell: bash
        run: |
          coverage=()
          if [ "$MATRIX_OS" = "ubuntu-latest" ] && [ "$MATRIX_PYTHON" = "3.11" ]; then
            coverage=(--cov=portolan_cli --cov=portolan_core --cov-report=xml)
          fi
          marker="not network and not slow and not benchmark"
          if [ "$MATRIX_SUITE" = "unit" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            marker="unit and not network and not slow and not benchmark"
          fi
          uv run pytest tests/ --ignore=tests/iceberg/ --ignore=tests/perf/ --tb=short \
            -m "$marker" \
            -n logical --dist loadscope \
            --durations=25 --durations-min=1.0 \
            "${coverage[@]}"

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: portolan-sdi/portolan-cli
          flags: main

      # A missing report fails the upload, so the coverage cell cannot stop writing it quietly.
      - name: Upload coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  perf-gates:
    name: Perf Counter Gates
    # Counters do not depend on machine load, so one Linux cell gates them at n and 2n.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.12

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Run the counter gates
        run: uv run pytest tests/perf -m "not slow" -n 4 --tb=short --durations=10

  codspeed:
    name: CodSpeed Benchmarks
    # CodSpeed counts instructions, so a CPU regression shows on a shared runner.
    # ubuntu-24.04: on a newer image the action builds valgrind, and PyArrow hits an illegal instruction.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.12

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Run the benchmarks under CodSpeed
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: uv run pytest tests/benchmark -m benchmark --codspeed
        env:
          # Valgrind does not emulate every vector instruction set. PyArrow
          # selects its kernels at run time, so this keeps the baseline kernels.
          ARROW_USER_SIMD_LEVEL: NONE

  plugin-test:
    # The example plugin uses the public plugin API alone. A change to
    # portolan_cli.api or portolan_cli.hookspecs that breaks a plugin fails here.
    name: Example Plugin (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: windows-latest, python-version: '3.13'}
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      # Install into the project venv: `uv run --with` built its overlay on the system Python.
      - name: Install the example plugin
        run: uv pip install ./tests/plugins/portolan_example

      - name: Run the example plugin tests
        run: uv run --no-sync pytest tests/plugins -m plugin --tb=short

  iceberg-test:
    name: Iceberg Unit & Integration Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    needs: changes
    # A core Python change can break the backend, so it runs these tests too.
    if: needs.changes.outputs.iceberg == 'true' || needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --extra iceberg --extra dev

      - name: Run unit and integration tests
        # Only the ubuntu-latest 3.11 cell measures coverage.
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python-version }}
        shell: bash
        run: |
          coverage=()
          if [ "$MATRIX_OS" = "ubuntu-latest" ] && [ "$MATRIX_PYTHON" = "3.11" ]; then
            coverage=(--cov-reset --cov=portolan_cli/backends/iceberg --cov-report=term-missing --cov-report=xml)
          fi
          uv run pytest tests/iceberg/ -v --tb=short -m "not e2e and not e2e_slow and not network and not slow" "${coverage[@]}"

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: portolan-sdi/portolan-cli
          flags: iceberg

      # Only the ubuntu-latest 3.11 cell uploads a report.
      - name: Upload coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-iceberg-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  diff-cover:
    # The coverage gate on changed lines. Codecov never blocks, so this job is the gate.
    # FLOOR is min(90, median of recent PRs rounded down to 5), per the portolan-ops norm.
    name: Diff Coverage
    needs: [test, iceberg-test]
    if: always() && github.event_name == 'pull_request' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Passed through env, not spliced into the script (zizmor).
      BASE_REF: ${{ github.base_ref }}
      # renovate: datasource=pypi depName=diff-cover
      DIFF_COVER_VERSION: "10.6.0"
      FLOOR: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      # No merge-multiple: the reports share one file name and would overwrite each other.
      - name: Download the coverage of every cell
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage

      - name: Check coverage of the changed lines
        run: |
          git fetch --no-tags origin "$BASE_REF"
          reports=(coverage/*/coverage.xml)
          echo "diff-cover reads ${#reports[@]} reports"
          status=0
          uvx "diff-cover==${DIFF_COVER_VERSION}" "${reports[@]}" \
            --compare-branch="origin/$BASE_REF" \
            --fail-under="$FLOOR" \
            --format "markdown:diff-cover.md" || status=$?
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  iceberg-e2e:
    name: Iceberg E2E Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.iceberg == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --extra iceberg --extra dev --extra e2e

      - name: Start Docker services
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml up -d --wait

      - name: Wait for REST catalog
        run: timeout 60 bash -c 'until curl -sf http://localhost:8181/v1/config; do sleep 2; done'

      - name: Wait for RustFS
        run: timeout 60 bash -c 'until curl -sf http://localhost:9000/health/live; do sleep 2; done'

      - name: Run E2E tests (fast tier, excludes e2e_slow)
        run: uv run pytest tests/iceberg/e2e/ -v --tb=long -m "e2e and not e2e_slow" --timeout=120

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml logs

      - name: Teardown
        if: always()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml down -v

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Check generated reference
        run: uv run python scripts/generate_reference_docs.py --check

      - name: Build documentation
        run: uv run zensical build --strict --clean

      # The example pushes and reads with no credentials. The bucket policy
      # grants anonymous read and write on portolan-docs only.
      - name: Start RustFS for documentation example
        run: |
          docker compose -f tests/iceberg/e2e/docker-compose.yml up -d rustfs
          timeout 60 bash -c 'until curl -sf http://localhost:9000/health/live; do sleep 2; done'
          docker compose -f tests/iceberg/e2e/docker-compose.yml run --rm --no-deps \
            -v "$PWD/tests/docs/portolan-docs-bucket-policy.json:/policy.json:ro" \
            --entrypoint /bin/sh rustfs-init -ec \
            'aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket portolan-docs || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket portolan-docs; aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket portolan-docs --policy file:///policy.json'

      - name: Test documentation examples
        env:
          AWS_REGION: us-east-1
          PORTOLAN_DOCS_RUSTFS: "1"
          PORTOLAN_S3_ENDPOINT: localhost:9000
          PORTOLAN_S3_USE_SSL: "false"
        run: uv run pytest tests/docs/ -v --tb=short

      - name: Upload documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site
          retention-days: 7

      - name: RustFS logs
        if: failure()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml logs

      - name: Stop RustFS
        if: always()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml down -v

  # zensical --strict checks Markdown links only. This also checks templates, nav, and raw HTML.
  site-links:
    needs: docs
    if: github.event_name == 'pull_request'
    uses: portolan-sdi/portolan-ops/.github/workflows/reusable-links.yml@v1
    permissions:
      contents: read
      # The reusable job declares issues: write for its weekly mode, so the caller must grant it.
      issues: write
    with:
      site-artifact: documentation-site

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      # The same commands as release.yml. tests/docs/test_ci_wiring.py keeps
      # the two equal.
      - name: Build packages
        run: |
          uv build --package portolan-core --out-dir dist/core
          uv build --package portolan-cli --out-dir dist/cli

      # List each sdist. An sdist must hold no build output, such as the
      # portolan-core wheel inside the portolan-cli sdist.
      - name: Check package contents
        run: |
          for sdist in dist/*/*.tar.gz; do
            echo "$sdist"
            tar -tzf "$sdist"
            if tar -tzf "$sdist" | grep -E '^[^/]+/dist[^/]*/|\.whl$'; then
              echo "::error::$sdist holds build output"
              exit 1
            fi
          done

  wheel-smoke:
    # Installs the portolan-core wheel alone and writes a catalog with it. The script needs
    # only the standard library and uv, so the job syncs no project environment.
    name: Wheel Smoke (portolan-core alone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Check the portolan-core wheel
        run: uv run --no-project --python 3.11 python scripts/wheel_smoke.py

  ci-success:
    name: CI Success
    # The one required check for branch protection. needs lists every job but `changes`,
    # and tests/docs/test_ci_wiring.py fails when one is missing.
    if: always()
    needs: [quality, security, test, plugin-test, perf-gates, codspeed, iceberg-test, iceberg-e2e, diff-cover, docs, site-links, build, wheel-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        env:
          # Trusted github context (success|failure|skipped|cancelled), passed
          # through env rather than spliced into the script body (zizmor).
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Dependency results: $RESULTS"
          # A skipped job (e.g. iceberg on a non-iceberg PR) is fine; a failed or
          # cancelled one is not.
          IFS=','
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not succeed (result: $r)"
              exit 1
            fi
          done
          echo "All required jobs passed (or were legitimately skipped)."
