# Tier 2 CI - Runs on every PR and push to main
#
# Philosophy: Starting from zero, all quality gates are STRICT.
# Nothing passes with warnings - fix issues or they block the PR.
#
# Supply-chain hardening:
# - Least-privilege GITHUB_TOKEN: read-only at the top level, widened per job.
# - Third-party actions are SHA-pinned with a trailing version comment
#   (Dependabot maintains the pins). actionlint + zizmor (prek.toml) guard this.
# - persist-credentials: false on every checkout (no job pushes to the repo).
# - Every job has a timeout so a hung step can't burn the runner budget.
name: CI
on:
  push:
    branches: [main]
  # No `branches:` filter. The full suite runs on every pull request whatever
  # it targets, including release branches and long-lived feature branches.
  # Restricting this to main silently gave release-branch PRs zero CI.
  pull_request:
  workflow_dispatch:  # Allow manual triggering

# Least-privilege default; no job here writes to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push to a PR obsoletes the old).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One uv version for every job. Renovate raises it after the 7-day delay.
env:
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.13.4"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      iceberg: ${{ steps.filter.outputs.iceberg }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            iceberg:
              - 'portolan_cli/backends/iceberg/**'
              - 'tests/iceberg/**'
              - 'pyproject.toml'
              # pyiceberg can move in the lock alone, through a transitive
              # bump or an explicit upgrade. Without this the Iceberg jobs
              # skip the very change that needs them.
              - 'uv.lock'
            python:
              - 'portolan_cli/**/*.py'

  quality:
    name: Quality Gates (prek — single rule source)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Run all quality gates
        # ONE rule source: CI runs the SAME hooks developers run locally
        # (prek.toml), not a re-listing of each tool with its own drifting args.
        # This covers ruff, ruff-format, mypy, import-linter, codespell, vulture,
        # jscpd, deptry, actionlint, zizmor, and the builtin file hooks.
        #
        # SKIP:
        # - no-commit-to-branch: meaningless in CI and fails on push-to-main
        #   (HEAD is `main`).
        # - fast-tests: the full matrix runs in the `test` job below.
        # - update-freshness: stamps today's date into freshness markers, so it
        #   is non-deterministic across days — a validation gate, not a mutation,
        #   is what CI needs. Reference drift is still caught by
        #   validate-agents-md (non-mutating), which DOES run here.
        env:
          SKIP: no-commit-to-branch,fast-tests,update-freshness
        run: uvx prek run --all-files --show-diff-on-failure

  security:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Audit dependencies (runtime + extras only)
        # Audit only what we ship: core runtime deps plus the publishable extras
        # (iceberg, pmtiles, thumbnails). Dev-group deps (moto, pytest, pip-audit
        # itself...) and doc-build deps (zensical, pymdown-extensions...) are excluded
        # because they never reach users via the wheel.
        #
        # Ignores come from the single-source .pip-audit-ignores file (each entry
        # has an expiry + reason; expired entries drop automatically). The same
        # file feeds nightly.yml and security-audit.yml — no more triplicated,
        # never-expiring inline --ignore-vuln lists.
        #
        # The export pins every package with hashes, so pip-audit audits the
        # list as written and builds no virtual environment. On the Ubuntu
        # 26.04 runner, the temporary environment fails in ensurepip.
        run: |
          uv export --no-dev --no-emit-project \
            --extra iceberg --extra pmtiles --extra thumbnails \
            -o /tmp/runtime-deps.txt
          # shellcheck disable=SC2046  # intentional word-splitting of the flag list
          uv run pip-audit \
            --disable-pip --require-hashes \
            --requirement /tmp/runtime-deps.txt \
            $(uv run python scripts/pip_audit_ignores.py)

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Anchor cells (suite: full) run the whole suite on every event: the
        # newest interpreter on each OS, plus the ubuntu-3.11 coverage cell.
        # The other cells run the unit lane on pull requests and the full
        # suite on push to main, so an interpreter-specific integration break
        # surfaces at merge instead of never.
        include:
          - {os: ubuntu-latest, python-version: '3.11', suite: full}
          - {os: ubuntu-latest, python-version: '3.13', suite: full}
          - {os: windows-latest, python-version: '3.13', suite: full}
          - {os: macos-latest, python-version: '3.13', suite: full}
          - {os: ubuntu-latest, python-version: '3.12', suite: unit}
          - {os: windows-latest, python-version: '3.11', suite: unit}
          - {os: windows-latest, python-version: '3.12', suite: unit}
          - {os: macos-latest, python-version: '3.11', suite: unit}
          - {os: macos-latest, python-version: '3.12', suite: unit}
    env:
      # Prevent obstore from attempting EC2 metadata service calls
      # GitHub Actions runners aren't EC2 instances, so IMDS requests fail
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install ${{ matrix.python-version }}

      - name: Install tippecanoe (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tippecanoe

      - name: Install tippecanoe (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tippecanoe

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Run tests (unit + integration, no network, no iceberg)
        # Speed decisions:
        # - `-n logical`: `-n auto` counts physical cores and started only 2
        #   workers on the 4-vCPU ubuntu/windows runners. Logical count starts 4.
        # - Every cell measures coverage. The diff-cover job reads the
        #   report of every cell, so a line that only Windows or macOS runs
        #   counts as covered there. No `# pragma: no cover` for
        #   platform-only code. The diff-cover summary lists the missed
        #   lines, so no cell prints the term-missing report.
        # - HYPOTHESIS_PROFILE=ci selects the reduced deterministic profile
        #   from tests/conftest.py. Nightly keeps the full default profile.
        # - --durations=25 records the slowest tests so a slow-test regression
        #   is visible in the log.
        # - tests/perf runs once, in the perf-gates job.
        env:
          HYPOTHESIS_PROFILE: ci
          MATRIX_SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          marker="not network and not slow and not benchmark"
          if [ "$MATRIX_SUITE" = "unit" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            marker="unit and not network and not slow and not benchmark"
          fi
          uv run pytest tests/ --ignore=tests/iceberg/ --ignore=tests/perf/ --tb=short \
            -m "$marker" \
            -n logical --dist loadscope \
            --durations=25 --durations-min=1.0 \
            --cov=portolan_cli --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: portolan-sdi/portolan-cli
          flags: main

      # The diff-cover job reads this report. A missing report fails the
      # upload, so a cell that stops writing it cannot pass quietly.
      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  perf-gates:
    name: Perf Counter Gates
    # tests/perf runs each scenario at n and 2n in cold child processes and
    # compares the slope and intercept of each counter with the constants in
    # tests/perf/expected. A count does not depend on machine load, so one
    # Linux cell gates it, and the test matrix skips tests/perf. The slow
    # thumbnail memory ceiling runs in the nightly slow job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.12

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Run the counter gates
        run: uv run pytest tests/perf -m "not slow" -n 4 --tb=short --durations=10

  codspeed:
    name: CodSpeed Benchmarks
    # CodSpeed runs tests/benchmark under CPU simulation and counts
    # instructions, so a CPU regression in a pure-Python hot path shows on a
    # shared runner. It compares each pull request with the base branch. The
    # upload uses OpenID Connect, which a public repository needs no token
    # for. It needs the CodSpeed GitHub app on the repository.
    # CodSpeed publishes its valgrind package for ubuntu 24.04. On a newer
    # image the action builds valgrind from source, and PyArrow then stops
    # with an illegal instruction.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install 3.12

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Run the benchmarks under CodSpeed
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: simulation
          run: uv run pytest tests/benchmark -m benchmark --codspeed
        env:
          # Valgrind does not emulate every vector instruction set. PyArrow
          # selects its kernels at run time, so this keeps the baseline kernels.
          ARROW_USER_SIMD_LEVEL: NONE

  plugin-test:
    # The example plugin uses the public plugin API alone (#947). A change to
    # portolan_cli.api or portolan_cli.hookspecs that breaks a plugin fails here.
    name: Example Plugin (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: windows-latest, python-version: '3.13'}
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      # Install into the project environment. With uv 0.6.14, `uv run --with`
      # built its overlay on the runner's system Python, not the synced 3.11
      # environment, and pytest could not import the plugin.
      - name: Install the example plugin
        run: uv pip install ./tests/plugins/portolan_example

      - name: Run the example plugin tests
        run: uv run --no-sync pytest tests/plugins -m plugin --tb=short

  iceberg-test:
    name: Iceberg Unit & Integration Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    needs: changes
    # Core Python changes run these tests too. #977 merged because a change to
    # the core backend calls skipped them. The Docker e2e job below keeps the
    # narrow filter, and nightly runs the full e2e suite.
    if: needs.changes.outputs.iceberg == 'true' || needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --extra iceberg --extra dev

      - name: Run unit and integration tests
        run: uv run pytest tests/iceberg/ -v --tb=short -m "not e2e and not e2e_slow and not network and not slow" --cov-reset --cov=portolan_cli/backends/iceberg --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: portolan-sdi/portolan-cli
          flags: iceberg

      # Every cell uploads its report. On a change that touches neither
      # filter, the job skips and the diff-cover job reads no Iceberg report.
      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-iceberg-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  diff-cover:
    # The coverage gate on the lines a pull request changes. Codecov reports
    # but never blocks (codecov.yml), so this job is the gate.
    #
    # Every cell of the test and Iceberg matrices uploads a coverage report
    # named coverage-<os>-<python> or coverage-iceberg-<os>-<python>. This
    # job downloads every artifact that matches coverage-* and passes all
    # the reports to diff-cover. diff-cover marks a line as missed only when
    # every report that measures the file misses it. Thus a line that only
    # Windows or macOS runs counts as covered. relative_files in
    # [tool.coverage.run] writes paths relative to the checkout, so the
    # Windows and macOS reports match the Linux checkout here.
    #
    # FLOOR comes from the last five merged pull requests that changed
    # portolan_cli, measured with the marker sets of the two coverage cells:
    # #868 100%, #985 100%, #1004 97%, #1011 100%, #1031 99%. The floor is
    # min(90, median rounded down to a multiple of 5), so 90. This matches
    # the portolan-ops norm for Python repos.
    name: Diff Coverage
    needs: [test, iceberg-test]
    if: always() && github.event_name == 'pull_request' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # diff-cover compares against the base branch of the pull request, so
      # a stacked pull request into an integration or release branch is
      # measured on its own diff. Passed through env, not spliced into the
      # script (zizmor).
      BASE_REF: ${{ github.base_ref }}
      # renovate: datasource=pypi depName=diff-cover
      DIFF_COVER_VERSION: "10.6.0"
      FLOOR: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      # Each artifact lands in coverage/<artifact name>/coverage.xml. Do not
      # set merge-multiple: the reports share one file name and overwrite
      # each other.
      - name: Download the coverage of every cell
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage

      - name: Check coverage of the changed lines
        run: |
          git fetch --no-tags origin "$BASE_REF"
          reports=(coverage/*/coverage.xml)
          echo "diff-cover reads ${#reports[@]} reports"
          status=0
          uvx "diff-cover==${DIFF_COVER_VERSION}" "${reports[@]}" \
            --compare-branch="origin/$BASE_REF" \
            --fail-under="$FLOOR" \
            --format "markdown:diff-cover.md" || status=$?
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  iceberg-e2e:
    name: Iceberg E2E Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.iceberg == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --extra iceberg --extra dev --extra e2e

      - name: Start Docker services
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml up -d --wait

      - name: Wait for REST catalog
        run: timeout 60 bash -c 'until curl -sf http://localhost:8181/v1/config; do sleep 2; done'

      - name: Wait for RustFS
        run: timeout 60 bash -c 'until curl -sf http://localhost:9000/health/live; do sleep 2; done'

      - name: Run E2E tests (fast tier, excludes e2e_slow)
        run: uv run pytest tests/iceberg/e2e/ -v --tb=long -m "e2e and not e2e_slow" --timeout=120

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml logs

      - name: Teardown
        if: always()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml down -v

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: uv sync --all-extras

      - name: Check generated reference
        run: uv run python scripts/generate_reference_docs.py --check

      - name: Build documentation
        run: uv run zensical build --strict --clean

      # The example pushes and reads with no credentials. The bucket policy
      # grants anonymous read and write on portolan-docs only.
      - name: Start RustFS for documentation example
        run: |
          docker compose -f tests/iceberg/e2e/docker-compose.yml up -d rustfs
          timeout 60 bash -c 'until curl -sf http://localhost:9000/health/live; do sleep 2; done'
          docker compose -f tests/iceberg/e2e/docker-compose.yml run --rm --no-deps \
            -v "$PWD/tests/docs/portolan-docs-bucket-policy.json:/policy.json:ro" \
            --entrypoint /bin/sh rustfs-init -ec \
            'aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket portolan-docs || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket portolan-docs; aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket portolan-docs --policy file:///policy.json'

      - name: Test documentation examples
        env:
          AWS_REGION: us-east-1
          PORTOLAN_DOCS_RUSTFS: "1"
          PORTOLAN_S3_ENDPOINT: localhost:9000
          PORTOLAN_S3_USE_SSL: "false"
        run: uv run pytest tests/docs/ -v --tb=short

      - name: Upload documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site
          retention-days: 7

      - name: RustFS logs
        if: failure()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml logs

      - name: Stop RustFS
        if: always()
        run: docker compose -f tests/iceberg/e2e/docker-compose.yml down -v

  # Checks the relative links in the built site. zensical --strict checks
  # Markdown links only. This also covers theme templates, navigation, and
  # raw HTML. The docs job uploads the site on pull requests only.
  site-links:
    needs: docs
    if: github.event_name == 'pull_request'
    uses: portolan-sdi/portolan-ops/.github/workflows/reusable-links.yml@v1
    permissions:
      contents: read
      # The reusable job declares issues: write for its weekly mode. A
      # caller must grant at least that, even though this mode never
      # writes an issue.
      issues: write
    with:
      site-artifact: documentation-site

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Check package contents
        run: |
          uv run python -c "import tarfile; t = tarfile.open(list(__import__('pathlib').Path('dist').glob('*.tar.gz'))[0]); print('\n'.join(t.getnames()))"

  ci-success:
    name: CI Success
    # Single aggregated status check for branch protection. Requiring THIS one
    # context (see scripts/apply_branch_protection.sh) instead of every matrix
    # cell means adding a Python version or OS never silently drops a required
    # check, and the conditionally-skipped iceberg jobs don't block PRs that
    # don't touch iceberg. needs lists every job but `changes`, and
    # tests/docs/test_ci_wiring.py fails when one is missing.
    if: always()
    needs: [quality, security, test, plugin-test, perf-gates, codspeed, iceberg-test, iceberg-e2e, diff-cover, docs, site-links, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        env:
          # Trusted github context (success|failure|skipped|cancelled), passed
          # through env rather than spliced into the script body (zizmor).
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Dependency results: $RESULTS"
          # A skipped job (e.g. iceberg on a non-iceberg PR) is fine; a failed or
          # cancelled one is not.
          IFS=','
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not succeed (result: $r)"
              exit 1
            fi
          done
          echo "All required jobs passed (or were legitimately skipped)."
