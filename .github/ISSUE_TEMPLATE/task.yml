name: Task
description: Chore, refactor, CI, or maintenance work
labels: [task]
body:
  - type: markdown
    attributes:
      value: >-
        Please explain what needs to change, why it matters, and how to
        confirm it's done. For large changes, discuss the proposal here
        before starting implementation. For small changes with a clear
        solution, we'd really appreciate a fix PR alongside the issue.

  - type: textarea
    id: what
    attributes:
      label: What needs doing?
      description: >-
        Describe the intended outcome and the files or systems involved.
        For example, "All Python repos should run the same lint checks,"
        rather than a list of edits to individual workflow files.
    validations:
      required: true

  - type: textarea
    id: why-now
    attributes:
      label: Why is this needed?
      description: >-
        Explain what this would improve or unblock, or what could go wrong
        if it waits. Link any issue or pull request that prompted the task.
    validations:
      required: true

  # issue_governance.py turns the answer into the matching P0 to P3 label,
  # and writing_check.py requires the section. Keep the label "Priority"
  # and the P0 to P3 prefixes. norms/repos.md holds the rubric. Change
  # both in one pull request.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: >-
        How soon does this need work? A maintainer can change it at triage.
        See the [priority rubric](https://github.com/portolan-sdi/portolan-ops/blob/main/norms/repos.md#priority).
      options:
        - "P0: Fix now. Data loss, a leaked secret, wrong published data with no warning, or a broken release."
        - "P1: Fix next. A common workflow fails with no workaround, or a check checks nothing."
        - "P2: Planned. A workaround exists, the case is rare, or the work improves speed or ease of use."
        - "P3: Backlog. An idea, an exploration, or work that waits on another project."
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation notes
      description: >-
        Optional. Include constraints, dependencies between steps, and
        anything else someone would need to know before starting.
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: How to confirm it's done
      description: >-
        What steps or command should a reviewer run, and what result
        would confirm the task is complete? If the work changes behavior,
        include the data or example used to check it.
    validations:
      required: true
