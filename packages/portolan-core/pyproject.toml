[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portolan-core"
version = "0.9.0"
description = "The Portolan library without the CLI or the geospatial stack"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Nissim Lebovits", email = "nlebovits@pm.me" },
]
dependencies = [
    "rashid-core>=0.5.0,<0.6.0", # The validator core without its data extra. 0.5.0 is the first release that ships the rashid_core import name
]

[project.urls]
"Homepage" = "https://github.com/portolan-sdi/portolan-cli"
"Source" = "https://github.com/portolan-sdi/portolan-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/portolan_core"]

# The root prek.toml runs deptry on this member as the deptry-core hook.
[tool.deptry.per_rule_ignores]
# No module here imports rashid_core yet. Delete this line when the first
# module moves in from portolan_cli (#1133).
DEP002 = ["rashid-core"]
