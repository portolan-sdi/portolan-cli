[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portolan-cli"
version = "0.9.0"
description = "A CLI tool for managing cloud-native geospatial data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Nissim Lebovits", email = "nlebovits@pm.me" },
]
keywords = ["cloud-native", "geospatial", "gis", "io"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "antimeridian>=0.3.11", # RFC 7946 compliant antimeridian handling for STAC bbox
    "click>=8.4,<8.6", # PYSEC-2026-2132 fix; 8.4 makes ParamType generic (temporal.FlexibleDateTime subscripts it)
    "defusedxml>=0.7.1", # Safe XML parsing (XXE protection) for CSW/ISO 19139 metadata
    "duckdb>=1.5.6,<2.0.1", # Floor skips 1.5.5, which segfaults in ST_Read_Meta on malformed input (duckdb/duckdb-spatial#860)
    "geopandas>=1.0.0", # Reads GeoParquet for the thumbnail floor, which every collection needs (Issue #683). 1.0 adds GeoDataFrame.from_arrow, which the thumbnail reads with
    "geoparquet-io>=1.7.0", # Keeps schema metadata keys on write (gpio#1280) and drops whole-table DuckDB round-trips in sort, bbox and repair (gpio#1285)
    "httpx>=0.27.0", # HTTP client for ArcGIS REST API discovery
    "matplotlib>=3.8.0", # Renders the deterministic thumbnail floor. Core, not optional: PTL-VIZ-001 is an ERROR, so a default install must be able to produce a conformant catalog (#518 Track 1, #683)
    "obstore>=0.12.1", # Cloud object storage; 0.12.1 preserves version in get/head metadata (obstore#807). SHA-256 HEAD support remains blocked (#982)
    "python-dotenv>=1.0.0", # Load .env files for credentials (Issue #356)
    "numpy>=1.24.0", # Array ops (transitive via rasterio, but we import directly for thumbnails)
    "pyarrow>=12.0.0,<27.0.0",
    "pyproj>=3.0.0", # CRS transformations (transitive via rasterio, but we import directly)
    "pystac>=1.10.0", # STAC catalog/collection/item creation
    "stac-geoparquet>=0.6.0", # Generate items.parquet for efficient STAC queries (optional)
    "pyyaml>=6.0", # YAML config file support
    "rasterio>=1.3.0", # Raster I/O (transitive via rio-cogeo, but we import directly)
    "shapely>=2.1.0", # Transitive via geopandas, but the thumbnail imports it. 2.1 adds orient_polygons, which draws polygon holes
    "aiohttp>=3.14.4", # CVE-2026-111063..111066, CVE-2026-111748..111750, GHSA-2g87-pp6c-29x5 fix (transitive via geoparquet-io/s3fs, pinned for security)
    "certifi>=2026.10.19", # PYSEC-2026-4320 fix (transitive via requests/httpx, pinned for security)
    "cryptography>=46.0.7", # CVE-2026-39892 fix (transitive via httpx/certifi, pinned for security)
    "lxml>=6.1.0", # CVE-2026-41066 fix (transitive via owslib, pinned for security)
    "pillow>=13.0.0", # CVE-2026-112390..112406 and CVE-2026-112891..112901 fix (transitive via rasterio, pinned for security)
    "pmtiles>=3.0.0", # PMTiles metadata reading (header, bounds, zoom levels)
    "pluggy>=1.5.0", # Plugin hooks (#947). Pure Python, no dependencies. 1.5 adds warn_on_impl_args for hook deprecation
    "pyogrio>=0.7.0", # FlatGeobuf metadata reading (transitive via geoparquet-io, but we import directly)
    "pygments>=2.20.0", # CVE-2026-4539 fix (transitive via rich, pinned for security)
    "requests>=2.33.0", # CVE-2026-25645 fix (transitive, pinned for security)
    "rich>=13.0.0", # Terminal progress bars (transitive via geoparquet-io, but we import directly)
    "rio-cogeo>=5.0.0", # COG creation/validation (includes rasterio)
    "rashid>=0.5.1,<0.6.0", # Conformance validator behind `portolan check`; ships its own STAC + Portolan profile schemas, so validation runs offline. A metapackage over rashid-core[data]. 0.5.1 is the floor because portolan-core needs rashid-core 0.5.1 and the metapackage pins rashid-core exactly (#1133). 0.5.0 is the first release whose import name is rashid_core, which the CLI imports. It also brings the PTL-LNK-006 IRI href, PTL-DAT-011 overview rounding and binary geometry column fixes. Earlier floors: 0.4.0 exempts a display-ready COG from PTL-VIZ-002, so a raster collection with the overview COG that PORTO-FMT-067 asks for and no style asset passes `check` (issue #1141), and its `validate()` takes a `ValidationOptions`. 0.2.0 added PTL-LIV-006, which `check --live` uses (issue #935). 0.1.5 added the catalog-logo rules PTL-LNK-007/008/009 (PORTO-CORE-074..077) and PTL-AST-006. The conformance gate asserts these rules, so this is a hard floor, not a preference
    # The library half of this repo. The pin is exact because both distributions
    # release together. cz bump rewrites it.
    "portolan-core==0.9.0",
    "lerc>=4.0.1", # Decodes the LERC tiles that hosted tiled imagery layers cache. GDAL 3.12 fails on LERC2 version 6 with "MRF: Error decoding Lerc", so `extract arcgis` cannot read a TilesOnly ImageServer without it (Issue #870). The wheel ships binaries for Windows x64, macOS, and Linux x86-64, so tilecache.py imports it lazily and explains the failure on other platforms
]

[project.scripts]
portolan = "portolan_cli:cli"

# Built-in commands that use the plugin path. An entry point that
# portolan-cli declares always loads, whatever PORTOLAN_PLUGINS says.
[project.entry-points."portolan.commands"]
"version.rollback" = "portolan_cli.backends.iceberg.cli:rollback"
"version.prune" = "portolan_cli.backends.iceberg.cli:prune"

[project.urls]
"Homepage" = "https://github.com/portolan-sdi/portolan-cli"
"Bug Tracker" = "https://github.com/portolan-sdi/portolan-cli/issues"
"Documentation" = "https://github.com/portolan-sdi/portolan-cli#readme"
"Source" = "https://github.com/portolan-sdi/portolan-cli"

[project.optional-dependencies]
iceberg = [
    "pyiceberg[sql-sqlite]>=0.8.0",
    "shapely>=2.0.0",
    "pygeohash>=1.2.0",
]
e2e = [
    "boto3>=1.35.0",
]
aws = [
    # obstore.auth.boto3 wraps a botocore session for AWS profiles. It is optional,
    # because a static key pair and the environment variables need none of it.
    "boto3>=1.35.0",
    # boto3 installs botocore. The profile errors live there, and the upload
    # path reads ProfileNotFound to tell a missing profile from a failed one.
    "botocore>=1.35.0",
]
dev = [
    "codespell>=2.4.1",
    "deptry>=0.25.1", # Dependency checker (unused, missing, transitive deps)
    "gitingest>=0.1.0", # Auto-fetch API docs for core dependencies
    "import-linter>=2.0", # Architecture enforcement via import contracts
    "commitizen>=4.13.4",
    "hypothesis>=6.151.5",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "prek>=0.5.11", # Hook runner. It reads prek.toml.
    "pytest>=9.0.3",
    "pytest-codspeed>=5.0.0", # CodSpeed CPU benchmarks; also runs the benchmark fixture locally
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.14.11",
    "types-defusedxml>=0.7.0", # Type stubs for defusedxml
    "types-PyYAML>=6.0", # Type stubs for PyYAML
    "vulture>=2.14",
]
# Core geoparquet-io makes PMTiles. The empty extra keeps
# `pip install portolan-cli[pmtiles]` working.
pmtiles = []
# Rendering is core. These add basemap tiles and the PMTiles MVT decode. Both
# load lazily behind a guard, so a default install renders without them.
thumbnails = [
    # viz/thumbnail.py calls private contextily functions, read at 1.7.0.
    # tests/unit/test_thumbnail.py::TestContextilyPrivateParts fails when they change.
    "contextily>=1.5.0", # Basemap tiles for vector thumbnails
    "mapbox-vector-tile>=2.0.0", # MVT decoding for PMTiles thumbnail generation
]
docs = [
    # Pinned exactly: zensical is alpha with a compiled core, so a floor
    # constraint is not a constraint. Dependabot offers reviewable bumps.
    "zensical==0.1.1",
    "mkdocstrings-python>=1.0.0", # pulls mkdocstrings itself as its own dependency
    "pymdown-extensions>=11.0", # zensical requires >=11.0; fixes filename=None in highlight
]

[tool.hatch.build.targets.wheel]
packages = ["portolan_cli"]

# ---------- workspace ----------
# packages/portolan-core is the library without Click or the geospatial stack.

[tool.uv.workspace]
members = ["packages/portolan-core"]

[tool.uv.sources]
portolan-core = { workspace = true }

# ---------- commitizen ----------

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.9.0"
# One bump moves both distributions and the exact pin between them.
version_files = [
    "pyproject.toml:^version",
    "packages/portolan-core/pyproject.toml:^version",
    "pyproject.toml:portolan-core==",
]
tag_format = "v$version"
# uv.lock records each workspace member version. Relock after version_files
# writes the new versions. cz stages what the hook writes.
pre_bump_hooks = ["uv lock"]
update_changelog_on_bump = true
# The project is pre-1.0. A breaking change bumps the minor number, so the
# major number stays at zero until the interface settles.
major_version_zero = true

# ---------- testing ----------

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--tb=short"
# An unknown marker fails collection. pytest 9.0.3 ignores --strict-markers in
# addopts: https://github.com/pytest-dev/pytest/issues/14442
strict_markers = true
markers = [
    "unit: Fast, isolated, no I/O (< 100ms each)",
    "integration: Multi-component, may touch filesystem",
    "network: Requires network access (mocked locally, real in CI nightly)",
    "refused_hosts: The network guard refuses these hosts without failing the test (child-process requests only)",
    "realdata: Uses real-world fixtures from tests/fixtures/realdata/ (tests orchestration, not geometry)",
    "snapshot: Compares output against golden files",
    "plugin: Needs the example plugin installed (tests/plugins/portolan_example)",
    "benchmark: Performance measurement, tracked over time",
    "slow: Takes > 5 seconds",
    "e2e: End-to-end tests requiring Docker (REST catalog + RustFS)",
    "e2e_slow: Extended E2E tests (concurrency stress, large datasets) - nightly only",
]

[tool.coverage.run]
source = ["portolan_cli", "portolan_core"]
branch = true
# The report names files relative to the checkout so the diff-cover job in
# ci.yml can read it.
relative_files = true
omit = [
    "portolan_cli/__init__.py",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ---------- linting & formatting ----------

[tool.ruff]
line-length = 100
target-version = "py311"
# portolan-ops syncs .claude/hooks/ and .claude/output-styles/ into every repo,
# and a sync run overwrites any fix made here. The rules dir holds only Markdown.
extend-exclude = [".claude"]

[tool.ruff.lint]
# explicit-preview-rules turns on only the preview rules that select names.
# Preview also changes stable defaults: one bans the `gpd` alias for geopandas.
preview = true
explicit-preview-rules = true
# Ruff owns complexity (C901), security (S), and docstring linting.
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "A", # flake8-builtins - shadowing a builtin hides it for the whole scope
    "ARG", # flake8-unused-arguments - an unused argument is a stale contract
    "C901", # mccabe complexity - replaces xenon's --max-absolute
    "D", # pydocstyle - see [tool.ruff.lint.pydocstyle] for the convention
    "DTZ", # flake8-datetimez - a naive datetime in a STAC temporal extent is a bug
    "ERA", # eradicate - commented-out code
    "EXE", # flake8-executable
    "FURB", # refurb - modern idiom upgrades
    "G", # flake8-logging-format
    "ICN", # flake8-import-conventions
    "INT", # flake8-gettext
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "N", # pep8-naming
    "PERF", # perflint
    "PIE", # flake8-pie
    "PTH", # flake8-use-pathlib - this repo passes paths everywhere; os.path invites str/Path drift
    "PYI", # flake8-pyi
    "Q", # flake8-quotes
    "RET", # flake8-return
    "RSE", # flake8-raise
    "S", # flake8-bandit - replaces the standalone bandit hook
    "SIM", # flake8-simplify
    "SLOT", # flake8-slots
    "T20", # flake8-print - output goes through output.py, never bare print
    "TC", # flake8-type-checking
    # Only the banned-api rule of flake8-tidy-imports. See banned-api below.
    "TID251",
    "YTT", # flake8-2020
    "PT", # flake8-pytest-style
    "RUF", # ruff-specific rules
    "PL", # pylint
    # Preview rules opt in by name. explicit-preview-rules keeps every other
    # preview rule off. These add the pylint size limits and a few low-noise checks.
    "PLR0914", # too many locals
    "PLR0916", # too many Boolean expressions
    "PLR0917", # too many positional arguments
    "PLR1702", # too many nested blocks
    "PLR6104", # use an augmented assignment
    "PLW1514", # open() without an explicit encoding
    "RUF052", # a used variable has a dummy name
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (Click uses this)
    "ISC001", # conflicts with the formatter
    "D1", # docstring coverage: scripts/check_comments.py checks the rendered API
    # Each hit isolates the failure of one item in a loop and continues. A handler
    # outside the loop stops the loop at the first failure.
    "PERF203", # try-except within a loop
    # Lazy imports of the heavy geospatial libraries keep CLI startup fast.
    "PLC0415", # import outside top level
    # `from x import y as y` marks an explicit re-export for mypy strict.
    "PLC0414", # useless import alias
]
# The CLI help uses the multiplication sign of "workers × concurrency".
# The scan output prints the information sign as its notice icon.
allowed-confusables = ["×", "ℹ"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Tests assert, reach into private helpers, and use fixture literals. The
# import, naming, and simplification rules still apply.
"tests/**/*.py" = [
    "S101", # assert is the point of a test
    "PLR2004", # an expected value in an assertion is clearest as a literal
    "S105", # "password"-shaped fixture literals
    "S106",
    "S108", # /tmp paths in fixtures
    "D", # test names carry the description; docstrings are optional
    "ARG", # pytest fixtures are injected and often unused by name
    "SLF001", # tests may reach into private helpers
    "T20", # a test may print for diagnostics
    "PTH123", # open() is fine in a fixture
    "ERA001", # commented-out fixture variants are deliberate
    "S603", # a harness starts docker or uv with a literal argument list
    "S607", # the harness resolves docker and uv from PATH
    "S310", # a test opens an https URL it writes itself
    "S311", # random builds test data, not a secret
    "S608", # a test builds a DuckDB query from a literal path
    "TID251", # a test imports portolan_cli.output to test or patch it
]
"scripts/**/*.py" = [
    "T20", # scripts are CLIs of their own and print by design
    "PLR2004", # a script compares against literal exit codes and thresholds
    "S310", # a script opens an https URL it writes itself
    "S603", # a script starts a tool or pytest with a literal argument list
    "S607", # the script resolves its tools from PATH
]
"examples/**/*.py" = ["T20"] # an example prints its result for the reader
# A Click command takes one argument per option. Any other outlier of the pylint
# size limits carries a line noqa with its reason.
"portolan_cli/**/*cli.py" = ["PLR0913", "PLR0917"]
# run_check and the check workflow take each check option as a keyword argument.
"portolan_cli/validation/runner.py" = ["PLR0913"]
"portolan_cli/validation/workflow.py" = ["PLR0913"]
# vulture's whitelist format is bare names and `_.attr` expressions. They are
# never executed, so the undefined `_` and the bare expressions are the format.
"vulture_whitelist.py" = ["F821", "B018"]
# TID251, permanent: the layer-cli contract, api.py, and sync/upload.py.
# tests/docs/test_quality_config.py keeps the lists equal.
"portolan_cli/cli.py" = ["TID251"]
"portolan_cli/cli_types.py" = ["TID251"]
"portolan_cli/emit.py" = ["TID251"]
"portolan_cli/add_progress.py" = ["TID251"]
"portolan_cli/scan/progress.py" = ["TID251"]
"portolan_cli/plugins/commands.py" = ["TID251"]
"portolan_cli/backends/iceberg/cli.py" = ["TID251"]
"portolan_cli/extract/*/cli.py" = ["TID251"]
"portolan_cli/extract/common/cli_helpers.py" = ["TID251"]
"portolan_cli/extract/common/layer_cli.py" = ["TID251"]
"portolan_cli/api.py" = ["TID251"]
"portolan_cli/sync/upload.py" = ["TID251"]
# The writer sink puts small catalog JSON and Markdown with its own Content-Type.
"packages/portolan-core/src/portolan_core/writer.py" = ["TID251"]
# TID251, ratchet. Delete only, here, in RATCHET_TID251, and in the
# output-is-cli-only ignore_imports. Never add one.

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Library output on stdout corrupts the JSON envelope. A direct obstore.put
# skips Content-Type and the part size. Ruff resolves aliases.
"portolan_cli.output".msg = "Library code logs through logging.getLogger. Only the CLI layer prints. See #1005."
"obstore.put".msg = "Call the put_object helper in portolan_cli.sync.upload. It sets Content-Type and the part size. See #807 and #908."
"obstore.put_async".msg = "Call the put_object_async helper in portolan_cli.sync.upload. See #807 and #908."

[tool.ruff.lint.flake8-builtins]
# The keyword arguments match the STAC "license" and ArcGIS "format" fields.
# No function that takes them calls the shadowed builtin.
builtins-ignorelist = ["license", "format"]

[tool.ruff.lint.pep8-naming]
# "ET" is the stdlib alias for xml.etree.ElementTree. convert.py matches
# duckdb.InterruptException by name, so a test double uses the same name.
extend-ignore-names = ["ET", "InterruptException"]

[tool.ruff.lint.isort]
known-first-party = ["portolan_cli", "portolan_core"]
# Every module defers annotation evaluation, so the TC rules can safely move
# an import into a TYPE_CHECKING block.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
# Without a convention ruff enables every D rule. The docstrings use Google style.
convention = "google"

[tool.ruff.lint.mccabe]
# The per-function ceiling. It equals pylint max-branches.
max-complexity = 15

[tool.ruff.lint.flake8-pytest-style]
# A bare pytest.raises of a broad Portolan error passes on any failure in the
# block. A match pins the failure that the test is about.
raises-extend-require-match-for = [
    "portolan_core.errors.PortolanError",
    "portolan_core.errors.CatalogError",
    "portolan_core.errors.CollectionError",
    "portolan_core.errors.SchemaError",
    "portolan_core.errors.ItemError",
    "portolan_core.errors.VersionError",
    "portolan_core.errors.ValidationError",
    "portolan_core.errors.ConversionError",
    "portolan_core.errors.LogoError",
    "portolan_core.errors.ConfigError",
    "portolan_core.errors.SyncError",
]

[tool.ruff.lint.pylint]
# Each limit sits near the p99 of the functions in portolan_cli, packages, and
# scripts, so a rule fires only on a real outlier.
max-args = 12
max-positional-args = 8
max-returns = 8
max-branches = 15
max-statements = 50
max-locals = 18
max-nested-blocks = 5
max-bool-expr = 5

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------- type checking ----------

[tool.mypy]
python_version = "3.11"
strict = true # Enables all strict flags at once
# Bare `uv run mypy` checks this scope. The prek hook passes no paths.
files = ["portolan_cli", "packages/portolan-core/src", "scripts", "tests"]
# The example plugin is a separate package. Its path lets mypy check
# its tests and its code without installing it.
mypy_path = ["packages/portolan-core/src", "tests/plugins/portolan_example/src"]
explicit_package_bases = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "redundant-self",
    "unused-awaitable",
    "deprecated",
    "exhaustive-match",
]
# Reports code that the types say cannot run, such as an isinstance branch the
# annotation already rules out.
warn_unreachable = true

# Tests may leave helpers and fixtures unannotated. Every other strict check applies.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

# These packages ship no py.typed marker and PyPI has no usable stub.
# types-rasterio needs Python 3.12.
[[tool.mypy.overrides]]
module = [
    "rasterio.*",
    "gitingest.*",
    "pygeohash.*",
    "contextily.*",
    "geoparquet_io.*",
    "geoarrow.*",
    "lerc.*",
    "mapbox_vector_tile.*",
    "pyogrio.*",
]
ignore_missing_imports = true

# types-Markdown exists, so mypy reports the missing stub in the importing file.
# One docs test imports markdown's slugify, so the override names that test.
[[tool.mypy.overrides]]
module = ["markdown.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.docs.test_reference_generation"]
disable_error_code = ["import-untyped"]

# ---------- spell check ----------

[tool.codespell]
# nd: a Unicode category. bu: an INSPIRE theme. lod: ArcGIS level of detail.
# The French words come from the Belgian ISO 19139 fixture.
ignore-words-list = "nd,bu,ue,adresse,projet,environnement,copie,explicite,connexion,objets,visibles,issus,fonction,mesures,informations,disjointness,lod"

# ---------- dead code ----------

[tool.vulture]
# 60 reports unused variables, attributes, and functions. 80 reports only
# unused imports and arguments. vulture_whitelist.py holds today's findings.
min_confidence = 60
paths = ["portolan_cli", "packages/portolan-core/src", "tests", "vulture_whitelist.py"]
exclude = [
    "portolan_cli/backends/protocol.py", # Protocol method params are intentionally unused
    "portolan_cli/backends/json_file.py", # Stub methods raise NotImplementedError
    "portolan_cli/backends/iceberg/backend.py", # Protocol methods + lifecycle hooks
]
sort_by_size = true
verbose = false
# A breaker in tests/property registers itself in BREAKERS. No caller names it.
ignore_decorators = ["@breaks"]

# ---------- architecture enforcement ----------

[tool.importlinter]
root_packages = ["portolan_cli", "portolan_core"]
# The layer contracts forbid click and rasterio.
# import-linter adds those external packages to the graph only with this flag.
include_external_packages = true

[[tool.importlinter.contracts]]
id = "cli-no-storage"
name = "CLI cannot import storage backends directly"
type = "forbidden"
source_modules = ["portolan_cli.cli"]
forbidden_modules = ["portolan_cli.backends"]
# Allow intermediate modules to access backends (CLI wraps API).
# cli.py uses these modules as a clean interface; direct cli->backends is still forbidden.
ignore_imports = [
    "portolan_cli.catalog -> portolan_cli.backends",
    # finalize_items routes version snapshots to the active backend. cli
    # reaches it only through the library layer.
    "portolan_cli.finalization -> portolan_cli.backends",
    "portolan_cli.finalization -> portolan_cli.backends.protocol", # PostAddContext types the on_post_add context
    "portolan_cli.version_ops -> portolan_cli.backends",
    "portolan_cli.version_ops -> portolan_cli.backends.protocol",
    "portolan_cli.hookspecs -> portolan_cli.backends.protocol", # TYPE_CHECKING only
]

[[tool.importlinter.contracts]]
id = "validation-is-an-adapter"
name = "Validation is a rashid adapter and must not import the CLI"
type = "forbidden"
# portolan_cli.validation is the adapter in front of rashid and returns plain
# data. cli.py depends on validation, never the reverse.
source_modules = ["portolan_cli.validation"]
forbidden_modules = ["portolan_cli.cli"]

[[tool.importlinter.contracts]]
id = "utilities-are-foundational"
name = "Utilities must not import other portolan modules"
type = "independence"
modules = [
    "portolan_cli.output",
    "portolan_core.errors",
    "portolan_core.constants",
    "portolan_cli.json_output",
    # A stdlib-only leaf that hardens agent-supplied arguments. It is not
    # catalog validation, so it is not in validation/.
    "portolan_cli.input_hardening",
]

# ---------- feature-package boundaries ----------

# sync may import scan. scan and viz are peers, and neither imports sync.

[[tool.importlinter.contracts]]
id = "viz-is-a-leaf"
name = "viz must not import the scan or sync layers"
type = "forbidden"
# viz/ makes thumbnails, Mapbox GL styles, and PMTiles. It is a leaf.
source_modules = ["portolan_cli.viz"]
forbidden_modules = ["portolan_cli.scan", "portolan_cli.sync"]

[[tool.importlinter.contracts]]
id = "scan-below-sync"
name = "scan must not directly import the sync or viz layers"
type = "forbidden"
# Direct imports only: scan.check reaches viz through shared root modules
# such as catalog, metadata, and convert.
source_modules = ["portolan_cli.scan"]
forbidden_modules = ["portolan_cli.sync", "portolan_cli.viz"]
allow_indirect_imports = true

# ---------- layers ----------

# Three layers: read (no Click, rasterio, or writes), manage (no Click), and cli.
# A library caller imports read and manage without the CLI shell.

[[tool.importlinter.contracts]]
id = "layer-read"
name = "Read layer: no click, rasterio, or write modules"
type = "forbidden"
source_modules = [
    "portolan_core.versions",
    "portolan_core.json_io",
    "portolan_core.bbox",
    "portolan_core.models",
    "portolan_core.query",
    "portolan_core.status",
    "portolan_core.catalog_list",
    "portolan_core.agents_md",
    # The run state of one command. Every read module may take it.
    "portolan_core.run_state",
]
forbidden_modules = [
    "click",
    "rasterio",
    "portolan_cli.cli",
    "portolan_cli.add",
    "portolan_cli.convert",
    "portolan_cli.preparation",
    "portolan_cli.finalization",
]

[[tool.importlinter.contracts]]
id = "layer-manage"
name = "Manage layer: no click"
type = "forbidden"
source_modules = ["portolan_cli", "portolan_cli.**"]
forbidden_modules = ["click"]
ignore_imports = [
    # The CLI layer is the one place Click belongs.
    "portolan_cli.cli -> click",
    "portolan_cli.cli_types -> click",
    "portolan_cli.emit -> click",
    "portolan_cli.plugins.commands -> click",
    "portolan_cli.backends.iceberg.cli -> click",
    "portolan_cli.extract.*.cli -> click",
    "portolan_cli.extract.common.cli_helpers -> click",
    "portolan_cli.extract.common.layer_cli -> click",
    # The Extractor protocol names click.Command for type checkers only.
    "portolan_cli.plugins.extractors -> click",
    "portolan_cli.plugins.builtin.extractors -> click",
    "portolan_cli.extract.common.source -> click",
    # check_extractor runs in a plugin's test suite and checks for a Click command.
    "portolan_cli.testing -> click",
    # The package root names the Click group for type checkers only. It loads
    # the group lazily through __getattr__.
    "portolan_cli -> portolan_cli.cli",
]

[[tool.importlinter.contracts]]
id = "layer-cli"
name = "CLI layer: only the CLI layer imports it"
type = "protected"
protected_modules = [
    "portolan_cli.cli",
    "portolan_cli.cli_types",
    "portolan_cli.emit",
    "portolan_cli.add_progress",
    "portolan_cli.scan.progress",
    "portolan_cli.plugins.commands",
    "portolan_cli.backends.iceberg.cli",
    "portolan_cli.extract.*.cli",
    "portolan_cli.extract.common.cli_helpers",
    "portolan_cli.extract.common.layer_cli",
]
allowed_importers = [
    "portolan_cli.cli",
    "portolan_cli.cli_types",
    "portolan_cli.emit",
    "portolan_cli.add_progress",
    "portolan_cli.scan.progress",
    "portolan_cli.plugins.commands",
    "portolan_cli.backends.iceberg.cli",
    "portolan_cli.extract.*.cli",
    "portolan_cli.extract.common.cli_helpers",
    "portolan_cli.extract.common.layer_cli",
]
ignore_imports = [
    # The package root names the Click group for type checkers only. It loads
    # the group lazily through __getattr__.
    "portolan_cli -> portolan_cli.cli",
]

# ---------- output and transport bans ----------

# The import-graph layer under ruff TID251. A stale ignore_imports line fails.

[[tool.importlinter.contracts]]
id = "output-is-cli-only"
name = "Only the CLI layer imports portolan_cli.output"
type = "forbidden"
source_modules = ["portolan_cli", "portolan_cli.**"]
forbidden_modules = ["portolan_cli.output"]
allow_indirect_imports = true
ignore_imports = [
    # Permanent. The CLI layer prints. api.py re-exports output for plugins.
    "portolan_cli.cli -> portolan_cli.output",
    "portolan_cli.emit -> portolan_cli.output",
    "portolan_cli.plugins.commands -> portolan_cli.output",
    "portolan_cli.extract.*.cli -> portolan_cli.output",
    "portolan_cli.extract.common.cli_helpers -> portolan_cli.output",
    "portolan_cli.extract.common.layer_cli -> portolan_cli.output",
    "portolan_cli.api -> portolan_cli.output",
    # Ratchet: the TID251 ratchet modules. Delete only.
]

[[tool.importlinter.contracts]]
id = "object-store-is-sync-transport-only"
name = "Only the sync transport modules and the writer sink import obstore"
type = "forbidden"
# portolan-core holds the reader modules, so the ban reads it too.
source_modules = ["portolan_cli", "portolan_cli.**", "portolan_core", "portolan_core.**"]
forbidden_modules = ["obstore"]
allow_indirect_imports = true
ignore_imports = [
    "portolan_core.writer -> obstore",
    "portolan_cli.sync.upload -> obstore",
    "portolan_cli.sync.download -> obstore",
    "portolan_cli.sync.push -> obstore",
    "portolan_cli.sync.pull -> obstore",
]

# ---------- portolan-core boundary ----------

# A library caller installs portolan-core without the CLI or the geospatial stack.

[[tool.importlinter.contracts]]
id = "sync-transport-no-scan"
name = "Sync transport modules must not import scan or convert"
type = "forbidden"
source_modules = [
    "portolan_cli.sync.transport",
    "portolan_cli.sync.push",
    "portolan_cli.sync.pull",
    "portolan_cli.sync.upload",
    "portolan_cli.sync.download",
]
forbidden_modules = ["portolan_cli.scan", "portolan_cli.convert"]

[[tool.importlinter.contracts]]
id = "core-no-cli"
name = "portolan-core must not import portolan_cli"
type = "forbidden"
source_modules = ["portolan_core"]
forbidden_modules = ["portolan_cli"]

[[tool.importlinter.contracts]]
id = "core-no-heavy"
name = "portolan-core must not import click or the geospatial stack"
# This list cannot see click behind rio_cogeo. The deptry-core hook in
# prek.toml rejects any import that portolan-core does not declare.
type = "forbidden"
source_modules = ["portolan_core"]
forbidden_modules = [
    "click",
    "rasterio",
    "pyarrow",
    "geopandas",
    "duckdb",
    "pystac",
    "pyproj",
    "shapely",
    "numpy",
]

# ---------- dependency checking ----------

[tool.deptry]
# Treat optional-dependencies groups as dev dependencies
optional_dependencies_dev_groups = ["dev", "docs"]
# Extend default exclusions (venv, .venv, tests, .git already excluded)
extend_exclude = [
    "scripts", # Standalone scripts may use external tools
    ".claude", # Claude Code worktrees and temp files
    # Each workspace member declares its own dependencies, so deptry checks it
    # against its own pyproject.toml. prek.toml runs that check as deptry-core.
    "packages",
]

# rashid 0.5 is a metapackage with no module of its own. Its import name is
# rashid_core, from the rashid-core[data] distribution it pins exactly.
[tool.deptry.package_module_name_map]
rashid = "rashid_core"

[tool.deptry.per_rule_ignores]
# Transitive dependencies pinned for stability or security.
DEP002 = [
    "aiohttp", # CVE-2026-111063 and others
    "certifi", # PYSEC-2026-4320
    "cryptography", # CVE-2026-39892
    "duckdb", # 1.5.5 segfaults in ST_Read_Meta: https://github.com/duckdb/duckdb-spatial/issues/860
    "lxml", # CVE-2026-41066
    "pillow", # CVE-2026-40192, CVE-2026-112390 and others
    "pygments", # CVE-2026-4539
    "requests", # CVE-2026-25645
    "pyiceberg",
    "shapely",
    "pygeohash",
    "boto3",
]

[dependency-groups]
dev = [
    # The conformance gate validates raster items against the vendored schema.
    # Declare jsonschema, so the gate does not depend on rashid to bring it.

    "jsonschema>=4.0.0",
    "moto[s3,server]>=5.0.0",
    "numpy>=2.2.6",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "types-pyyaml>=6.0.12.20250915",
    # pyarrow ships py.typed but leaves most of its API untyped.
    "pyarrow-stubs>=20.0.0.20260819",
    # shapely ships no inline types.
    "types-shapely>=2.1",
    # pandas ships no inline types.
    "pandas-stubs>=2.2",
    # jsonschema ships no inline types.
    "types-jsonschema>=4.25",
    # geopandas ships no inline types.
    "types-geopandas>=1.0",
    # requests ships no inline types.
    "types-requests>=2.32",
    # boto3 ships no inline types. The s3 extra types the S3 client the tests use.
    "boto3-stubs[s3]>=1.35",
]
