# Synced skeleton from portolan-sdi/portolan-ops.
# Codecov reports coverage but never controls a merge. The reusable CI runs
# diff-cover at 90% as the local coverage gate.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 90%
        informational: true

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
