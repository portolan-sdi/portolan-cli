services:
  rest-catalog:
    image: apache/iceberg-rest-fixture:1.10.1
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # RustFS, not MinIO. MinIO closed its community distribution in September 2026.
  # Neither Docker Hub nor quay.io serves its images to an anonymous client, so
  # the jobs that start this file could not pull them. See #919.
  #
  # RustFS serves the same S3 API on the same port. It applies a bucket policy,
  # refuses an anonymous read of a private bucket, and answers
  # /minio/health/live, so the CI wait loops need no change. The service keeps
  # the name `minio`, because the REST catalog, the test fixtures, and the
  # documentation job address it by that host name.
  minio:
    image: rustfs/rustfs:1.0.1
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # RustFS ships no client. The AWS CLI creates the buckets over the S3 API.
  minio-init:
    image: amazon/aws-cli:2.31.19
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9000 s3api create-bucket --bucket warehouse || true;
      aws --endpoint-url http://minio:9000 s3api create-bucket --bucket stac-metadata || true;
      exit 0;
      "
